[project]
name = "careerkit"
version = "0.1.0"
description = "Small, offline-first tools for LinkedIn career growth and job search."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "reportlab>=4", "openpyxl>=3.1", "pre-commit>=3.7"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
postlint = { workspace = true }
li-metrics = { workspace = true }
bawsala-feeds = { workspace = true }
apply-kit = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
