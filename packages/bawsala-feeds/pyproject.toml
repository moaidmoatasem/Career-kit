[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bawsala-feeds"
version = "0.1.0"
description = "Terms-aware job feed plugins (Arbeitnow, Remotive, Adzuna, Reed) with rule-based scoring. Code only, no data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
bawsala-feeds = "bawsala_feeds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bawsala_feeds"]
