[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postlint"
version = "0.1.0"
description = "Pre-publish linter for LinkedIn posts and PDF carousels: length, hook, hype words, confidentiality blocklist, PDF hygiene."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pypdf>=5"]

[project.scripts]
postlint = "postlint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postlint"]
